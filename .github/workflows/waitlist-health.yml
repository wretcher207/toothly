name: Waitlist health

on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'
  push:
    paths:
      - 'landing/**'
      - 'scripts/check_waitlist.py'
      - '.github/workflows/waitlist-health.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_waitlist.py
