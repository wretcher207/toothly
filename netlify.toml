[build]
  publish = "landing"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/COPY.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/vercel.json"
  to = "/404.html"
  status = 404
  force = true
